<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هيا نلعب</title>
    <style>
        * { -webkit-user-select: none; user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: #000; color: #0f0;
            font-family: 'Courier New', monospace; overflow: hidden;
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.4s; animation-iteration-count: infinite; }

        #start-screen { text-align: center; padding: 20px; }
        .game-title { color: #fff; font-family: sans-serif; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px #0f0; }
        #start-btn {
            padding: 20px 60px; font-size: 22px; background: #0f0; color: #000;
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px #0f0; font-family: sans-serif; transition: 0.3s;
        }
        
        #hack-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255,0,0,0.1), rgba(255,0,0,0.1) 1px, transparent 1px, transparent 2px), #000;
            z-index: 9999; flex-direction: column; padding: 10px; box-sizing: border-box;
        }
        
        .warning-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: red; opacity: 0.2; z-index: 10000; animation: flash 0.1s infinite; pointer-events: none; }
        @keyframes flash { 0% { opacity: 0; } 50% { opacity: 0.4; } 100% { opacity: 0; } }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #200; border-bottom: 2px solid #f00; padding: 10px; z-index: 10001; }
        .camera-status { color: red; font-weight: bold; font-size: 16px; }

        .countdown-container { text-align: center; margin: 15px 0; z-index: 10001; }
        .countdown-number { color: #f00; font-size: 70px; font-weight: bold; font-family: 'Arial', sans-serif; text-shadow: 0 0 20px #f00; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .terminal { flex-grow: 1; overflow: hidden; font-size: 12px; line-height: 1.1; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10001; opacity: 0.8;}
        .log-line { white-space: nowrap; margin-bottom: 2px;}
        
        /* شاشة العقاب عند محاولة الخروج */
        #trap-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(50, 0, 0, 0.95); z-index: 99999; 
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center; font-family: sans-serif;
        }
        #trap-screen h1 { color: #f00; font-size: 40px; animation: blink 0.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="game-title">هيا نلعب لعبة... 🎮</div>
        <div class="game-subtitle">تحذير: لا تحاول الخروج بعد البدء</div>
        <button id="start-btn" onclick="startPrank()">أنا جاهز!</button>
    </div>

    <div id="hack-screen">
        <div class="warning-flash"></div>
        <div class="top-bar">
            <div class="camera-status">☠️ SYSTEM HACKED</div>
            <div class="camera-status">DO NOT EXIT</div>
        </div>
        <div class="countdown-container">
            <div class="countdown-number" id="timer">30</div>
        </div>
        <div class="terminal" id="terminal"></div>
    </div>

    <!-- شاشة العقاب -->
    <div id="trap-screen">
        <h1>ACCESS DENIED</h1>
        <p style="font-size: 20px;">محاولة هروب مكتشفة!</p>
        <p style="font-size: 16px; color: gray;">جاري إعادة تفعيل وضع الاختراق...</p>
    </div>

    <script>
        let prankActive = false;
        let logInterval, timerInterval;
        let timeLeft = 30;

        // 1. مصيدة زر الرجوع
        history.pushState(null, null, location.href);
        window.onpopstate = function () { if (prankActive) history.go(1); };

        // 2. الأصوات
        function playVoice(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إلغاء أي صوت سابق
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-US'; msg.rate = 0.9; msg.pitch = 0.1; msg.volume = 1;
                window.speechSynthesis.speak(msg);
            }
        }

        function forceFullScreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => {}); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        }

        const fakeLogs = [
            "root@system:~# sudo rm -rf /", "Bypassing firewall... [SUCCESS]",
            "Downloading /etc/shadow...", "Uploading photos to remote server...",
            "Finding saved passwords...", "ERROR 404: Privacy Not Found", "> You are a victim."
        ];

        function startPrank() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hack-screen').style.display = 'flex';
            document.body.classList.add('shaking');
            prankActive = true;

            forceFullScreen();
            playVoice("Warning. System compromised. Do not try to exit.");

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer').innerText = timeLeft;
                    if(timeLeft <= 5 && timeLeft > 0) playVoice(timeLeft.toString());
                }
            }, 1000);

            const terminal = document.getElementById('terminal');
            logInterval = setInterval(() => {
                const line = document.createElement('div');
                line.className = 'log-line ' + (Math.random() > 0.5 ? 'red' : 'white');
                line.innerText = fakeLogs[Math.floor(Math.random() * fakeLogs.length)];
                terminal.appendChild(line);
                if (terminal.childNodes.length > 20) terminal.removeChild(terminal.firstChild);
            }, 50);

            setTimeout(endPrank, 30000);
        }

        function endPrank() {
            if(!prankActive) return;
            prankActive = false;
            clearInterval(logInterval);
            clearInterval(timerInterval);
            window.speechSynthesis.cancel();
            
            document.body.classList.remove('shaking');
            if (document.exitFullscreen) { document.exitFullscreen().catch(err=>{}); }

            document.body.innerHTML = `
                <div style="text-align: center; font-family: sans-serif; padding: 20px; background:#000; height:100vh; display:flex; flex-direction:column; justify-content:center;">
                    <h1 style="color: #0f0; font-size: 60px;">😂</h1>
                    <h1 style="color: #f00; font-size: 28px;">معاك في المقلب يا صاحبي</h1>
                    <p style="color: #fff;">جهازك سليم 100%</p>
                </div>
            `;
        }

        // 🚀 السر الأقوى: مصيدة محاولة الخروج من ملء الشاشة
        document.addEventListener('fullscreenchange', (event) => {
            if (!document.fullscreenElement && prankActive) {
                // لقد حاول الخروج من ملء الشاشة!
                
                // 1. أظهر شاشة العقاب
                document.getElementById('trap-screen').style.display = 'flex';
                
                // 2. شغل صوت مرعب
                playVoice("Access Denied. Do not try to escape.");
                
                // 3. اهتزاز الهاتف (إذا كان يدعم)
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);

                // 4. إعادة إجباره على ملء الشاشة بعد نصف ثانية
                setTimeout(() => {
                    forceFullScreen();
                    document.getElementById('trap-screen').style.display = 'none';
                }, 800);
            }
        });

        // مصيدة زر الهوم (إذا خرج من المتصفح وعاد)
        document.addEventListener("visibilitychange", function() {
            if (prankActive && !document.hidden) {
                forceFullScreen();
                playVoice("I see you. You cannot hide.");
            }
        });
    </script>
</body>
</html>
